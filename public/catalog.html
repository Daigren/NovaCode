<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCode - Каталог курсов</title>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="assets/js/header.js" defer></script>
    <script src="assets/js/catalog.js" defer></script>
    <script src="assets/js/filter.js" defer></script>
    
    <link rel="icon" type="image/svg+xml" href="assets/images/main.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <img src="./assets/images/iconHeader.svg" alt="icon">
        <a href="./index.html">Главная</a>
        <a href="./catalog.html">Курсы</a>
        
        <a href="#" id="navProfileLink" style="opacity: 0; transition: opacity 0.3s ease;">Профиль</a>

        <button id="consultation" onclick="window.location.href='./consultation.php';">
            консультация
        </button>
    </header>

    <main class="container-custom">
        <div class="search-bar">
            <div class="container search-container">
                <form id="searchForm" style="width: 100%; display: flex; gap: 20px; align-items: center;">
                    <div class="search-input-wrapper" style="flex: 1;">
                        <span class="search-icon">
                            <img src="./assets/images/search.svg" alt="search">
                        </span>
                        <input type="text" id="searchInput" placeholder="Найти курс">
                    </div>
                    
                    <div class="filter-wrapper" style="position: relative;">
                        <button type="button" class="filter-btn" id="openFiltersBtn">≡ фильтры</button>
                        <div id="filterMenu" class="filter-dropdown">
                            <div class="filter-header">Категории</div>
                            <label class="filter-option"><input type="radio" name="cat" value="" class="category-radio" checked><span>Все направления</span></label>
                            <label class="filter-option"><input type="radio" name="cat" value="Python" class="category-radio"><span>Python</span></label>
                            <label class="filter-option"><input type="radio" name="cat" value="C++" class="category-radio"><span>C++</span></label>
                            <label class="filter-option"><input type="radio" name="cat" value="C#" class="category-radio"><span>C#</span></label>
                            <label class="filter-option"><input type="radio" name="cat" value="Java" class="category-radio"><span>Java</span></label>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="adminMessage" style="margin-top: 20px; text-align: center; font-weight: bold;"></div>

        <section class="admin-panel">
            <h2>Добавить новый курс</h2>
            <form id="addCourseForm">
                <div class="form-group">
                    <label for="title">Название курса</label>
                    <input type="text" id="title" required placeholder="Например: Основы алгоритмов">
                </div>
                <div class="form-group">
                    <label for="category">Категория</label>
                    <select id="category" required>
                        <option value="Python">Python</option>
                        <option value="C++">C++</option>
                        <option value="C#">C#</option>
                        <option value="Java">Java</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="type">Тип курса</label>
                    <select id="type" required>
                        <option value="online">Онлайн-формат</option>
                        <option value="offline">Офлайн-формат</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Добавить курс</button>
            </form>
        </section>

        <h1 class="coursesTitle" style="margin-top: 60px;">Онлайн-курсы</h1>
        <section id="onlineCoursesContainer" class="mainContent_2"></section>

        <h1 class="coursesTitle">Офлайн-курсы</h1>
        <section id="offlineCoursesContainer" class="mainContent_2"></section>

    </main>

</body>
</html>

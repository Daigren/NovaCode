<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чтение курса - NovaCode</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="assets/js/animations.js" defer></script>
    <style>
        .course-content {
            background: #000000;
            border: 1px solid var(--gray-700);
            padding: 30px;
            border-radius: 8px;
            margin-top: 20px;
            line-height: 1.6;
            font-size: 16px;
            color: #ffffff;
        }
        /* Стили в черно-белом стиле для соответствия предпросмотру редактора */
        .course-content h1, .course-content h2, .course-content h3, .course-content h4 { 
            color: #ffffff; 
            margin-top: 20px; 
        }
        .course-content pre { 
            background: #000000; 
            border: 1px solid var(--gray-700);
            padding: 15px; 
            border-radius: 6px; 
            overflow-x: auto; 
        }
        .course-content code { 
            font-family: monospace; 
            color: #ffffff; 
            background: #111111;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body style="background: var(--bg-color); color: white; padding: 40px; max-width: 900px; margin: 0 auto;">

    <button onclick="window.location.href='catalog.html'" class="fade-element" style="background: transparent; color: white; border: 1px solid #ffffff; border-radius: 5px; font-size: 13px; padding: 8px 20px; cursor: pointer; transition: all 0.5s ease; margin-bottom: 20px;" onmouseover="this.style.backgroundColor='white';this.style.color='black'" onmouseout="this.style.backgroundColor='transparent';this.style.color='white'">
        ← Вернуться в каталог
    </button>

    <h1 id="courseTitle" class="fade-element" style="color: var(--neon-cyan);">Загрузка...</h1>
    
    <div id="courseContent" class="course-content fade-element"></div>


    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        async function loadView() {
            if (!courseId) {
                document.getElementById('courseTitle').innerText = 'Ошибка: курс не выбран';
                return;
            }

            // Мы можем использовать тот же api/editor.php, так как GET-запрос просто отдает текст
            const response = await fetch(`../api/editor.php?id=${courseId}`);
            const data = await response.json();
            
            if (data.status === 'success') {
                document.getElementById('courseTitle').innerText = data.course.title;
                const content = data.course.content || '*В этом курсе пока нет материалов. Автор скоро их добавит!*';
                document.getElementById('courseContent').innerHTML = marked.parse(content);
            } else {
                document.getElementById('courseTitle').innerText = 'Ошибка загрузки';
                document.getElementById('courseContent').innerHTML = `<p style="color:#ff4444;">${data.message}</p>`;
            }
        }
        
        loadView();
    </script>
</body>
</html>
